entity: company_relationships
notes: >
  One relationship per legacy cliente/proveedor/tecnico against a chosen
  operating company. Owner company selection is UNRESOLVED.

id_map: migration_company_relationship_map
never_assume_legacy_id_equals_new_id: true

target:
  table: company_relationships
  unique:
    - [owner_company_id, related_company_id, kind, deleted_token]
  check:
    - owner_company_id_ne_related_company_id

owner:
  mapping: FK
  via: migration_company_map
  source: empresas
  notes: UNRESOLVED — REQUIRES REVIEW which operating company owns each party.

sources:
  - table: clientes
    kind: customer
    related_via:
      map: migration_company_map
      source: clientes

  - table: proveedores
    kind: supplier
    related_via:
      map: migration_company_map
      source: proveedores

  - table: tecnicos
    kind: technician
    related_via:
      map: migration_company_map
      source: tecnicos

fields:
  kind:
    mapping: constant
    from_source_table:
      clientes: customer
      proveedores: supplier
      tecnicos: technician
    confidence: high

  status:
    mapping: unresolved
    notes: UNRESOLVED — boolean estado/activo vs enum; tecnicos.estado_id → legacy_status_id only
    default_if_forced: active
    confidence: unresolved

  classification:
    sources:
      - clientes.is_intercompany
    mapping: conditional
    transform: true_to_intercompany_else_commercial
    confidence: medium

  owner_reference:
    sources:
      - clientes.codigo
      - proveedores.codigo
      - tecnicos.codigo
    mapping: rename
    notes: tecnicos.codigo vs codigo_tecnico UNRESOLVED
    confidence: medium

  brand_id:
    sources:
      - clientes.marca_id
    mapping: FK
    via: migration_brand_map
    confidence: high

  delegation_id:
    sources:
      - clientes.delegacion_id
      - proveedores.delegacion_id
      - tecnicos.delegacion_id
    mapping: FK
    via: migration_delegation_map
    confidence: high

  billing_language_id:
    sources:
      - clientes.billing_language_id
    mapping: FK
    via: migration_language_map
    confidence: high

  series_id:
    sources:
      - clientes.serie_id
    mapping: FK
    via: migration_series_map
    confidence: high

  integration_id:
    sources:
      - clientes.integracion_id
    mapping: FK
    confidence: high

  integration_external_id:
    sources:
      - clientes.integracion_relacion_id
    mapping: rename
    confidence: medium

  reported_customer_relationship_id:
    sources:
      - clientes.cliente_reportado_id
    mapping: FK
    via: migration_company_relationship_map
    source: clientes
    defer: true
    confidence: high

  corrective_work_order_owner_id:
    sources:
      - clientes.responsable_ots_correctivas_id
    mapping: FK
    via: migration_user_map
    confidence: high

  preventive_work_order_owner_id:
    sources:
      - clientes.responsable_ots_preventivas_id
    mapping: FK
    via: migration_user_map
    confidence: high

  quality_owner_id:
    sources:
      - clientes.responsable_qc_id
    mapping: FK
    via: migration_user_map
    confidence: high

  account_owner_id:
    sources:
      - clientes.responsable_cliente_id
      - tecnicos.responsable_id
    mapping: FK
    via: migration_user_map
    notes: technician responsable_id → account_owner_id is medium confidence
    confidence: medium

  commercial_owner_id:
    sources:
      - clientes.responsable_comercial_id
    mapping: FK
    via: migration_user_map
    confidence: high

  sourced_by_user_id:
    sources:
      - tecnicos.encontrado_por_id
    mapping: FK
    via: migration_user_map
    confidence: high

  notes:
    sources:
      - clientes.observaciones
      - proveedores.observaciones
      - tecnicos.observaciones
    mapping: rename
    confidence: high

  internal_notes:
    sources:
      - clientes.observaciones_privadas
      - proveedores.observaciones_privadas
      - tecnicos.observaciones_privadas
    mapping: rename
    confidence: high

  notes_alert:
    sources:
      - clientes.observaciones_aviso
      - proveedores.observaciones_aviso
      - tecnicos.observaciones_aviso
    mapping: rename
    confidence: high

  internal_notes_alert:
    sources:
      - clientes.observaciones_privadas_aviso
      - proveedores.observaciones_privadas_aviso
      - tecnicos.observaciones_privadas_aviso
    mapping: rename
    confidence: medium

  onboarding_notes:
    sources:
      - clientes.onboarding
    mapping: rename
    confidence: high

  billing_comments:
